name: Snapshot Workflow
on:
  push:
    branches: [ '**' ] # Triggers on every commit to any branch

jobs:
  snapshot-pipeline:
    name: Snapshot CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Run code quality & security checks (Ubuntu only to save macOS time)
      - name: Code Quality & Security Analysis
        if: matrix.os == 'ubuntu-latest'
        run: |
          flutter analyze --no-fatal-infos
          dart format --set-exit-if-changed lib/ test/
          # Check for outdated/vulnerable packages
          flutter pub outdated
          # Optional: Add Snyk/Trivy here for deeper CVE scanning

      - name: Run Tests
        if: matrix.os == 'ubuntu-latest'
        run: flutter test --coverage

      - name: Build Android (Debug)
        if: matrix.os == 'ubuntu-latest'
        run: flutter build apk --debug

      - name: Build iOS (Debug)
        if: matrix.os == 'macos-latest'
        run: flutter build ios --debug --no-codesign

      - name: Verify Build Artifacts
        run: ls -R build/